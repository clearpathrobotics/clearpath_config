serial_number: a300-0000
version: 0
system:
  hosts:
    - hostname: cpr-a300-0000
      ip: 192.168.131.1
  ros2:
    namespace: a300_0000
platform:
  attachments:
    - name: front_bumper
      type: a300.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a300.bumper
      parent: rear_bumper_mount
    - name: observer_backpack
      type: a300.observer_backpack
    - name: observer_arch
      type: a300.observer_arch
      parent: observer_backpack_center_mount
      xyz: [-0.4, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
sensors:
  imu:
    - model: phidgets_spatial
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.059, 0.0, 0.161275]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        phidgets_spatial:
          data_interval_ms: 20
  ins:
    - model: fixposition
      parent: observer_backpack_rear_face_mount
      antennas:
        - parent: observer_arch_right_antenna_mount
        - parent: observer_arch_left_antenna_mount