serial_number: a300-0000
version: 0
system:
  hosts:
    - hostname: cpr-a300-0000
      ip: 192.168.131.1
  ros2:
    namespace: a300_0000
platform:
  attachments:
    - name: front_bumper
      type: a300.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a300.bumper
      parent: rear_bumper_mount
    - name: observer_backpack
      type: a300.observer_backpack
    - name: observer_arch
      type: a300.observer_arch
      parent: observer_backpack_center_mount
      xyz: [-0.4, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
sensors:
  imu:
    - model: phidgets_spatial
      urdf_enabled: true
      launch_enabled: true
      parent: default_mount
      xyz: [0.059, 0.0, 0.161275]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        phidgets_spatial:
          data_interval_ms: 20
  ins:
    - model: fixposition
      parent: observer_backpack_rear_face_mount
      antennas:
        - parent: observer_arch_right_antenna_mount
        - parent: observer_arch_left_antenna_mount
  camera:
    - model: intel_realsense
      parent: observer_backpack_front_face_mount
      xyz: [0.02, 0.0, 0.0]
    - model: axis_camera
      parent: observer_backpack_center_mount
      xyz: [0.35, 0.0, 0.025]
      ros_parameters:
        axis_camera:
          device_type: q62
          hostname: "192.168.131.10"
          http_port: 80
          username: "root"
          password: ""
          width: 640
          height: 480
          fps: 20
          tf_prefix: "axis"
          camera_info_url: ""
          use_encrypted_password : False
          camera : 1
          ir: True
          defog: True
          wiper: True
          ptz: True
          min_pan: -3.141592653589793
          max_pan: 3.141592653589793
          min_tilt: 0.0
          max_tilt: 1.5707963267948966
          min_zoom: 1
          max_zoom: 24
          max_pan_speed: 2.61
          max_tilt_speed: 2.61
          ptz_teleop: True
          button_enable_pan_tilt : -1
          button_enable_zoom     : -1
          axis_pan      : 3
          axis_tilt     : 4
          invert_tilt   : False
          axis_zoom_in: 5
          axis_zoom_out: 2
          zoom_in_offset: -1.0
          zoom_out_offset: -1.0
          zoom_in_scale: -0.5
          zoom_out_scale: 0.5
          scale_pan     : 2.61
          scale_tilt    : 2.61
          scale_zoom    : 100.0
